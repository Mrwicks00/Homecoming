[profile.default]
bytecode_hash = "none"
evm_version = "cancun"
ffi = true
fs_permissions = [{ access = "read-write", path = ".forge-snapshots/" }]
libs = ["lib"]
out = "out"
src = "src"
via_ir = true
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
depth = 32
fail_on_revert = false

# NOTE: a no-IR profile is not viable here — CowRecaptureReceiver.recapture hits "stack too
# deep" without via_ir. The whole codebase requires the IR pipeline; `forge build` is ~90s.

[lint]
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const"]
lint_on_build = false

[rpc_endpoints]
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC_URL}"
ethereum_sepolia = "${ETHEREUM_SEPOLIA_RPC_URL}"

[etherscan]
unichain_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = "1301" }
ethereum_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = "sepolia" }
